name: FEMM second brain
on:
  pull_request:
    paths: ['femm_brain/**', '.github/workflows/femm-brain.yml']
  push:
    branches: [main]
    paths: ['femm_brain/**', '.github/workflows/femm-brain.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: femm-brain-${{ github.ref }}
  cancel-in-progress: true
jobs:
  graph-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m femm_brain validate
      - run: python -m unittest discover -s femm_brain/tests -v
      - run: node --check femm_brain/static/app.js
      - run: node --check femm_brain/static/simulation.js
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python femm_brain/tests/browser_smoke.py
        env:
          BROWSER_SMOKE_ARTIFACTS: brain-browser-artifacts
      - name: Package portable offline application
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          with ZipFile('femm-second-brain.zip', 'w', ZIP_DEFLATED) as archive:
              for path in Path('femm_brain').rglob('*'):
                  if path.is_file() and '__pycache__' not in path.parts and path.suffix != '.pyc':
                      archive.write(path, str(path))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: femm-second-brain-offline
          path: femm-second-brain.zip
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: femm-brain-browser
          path: brain-browser-artifacts
          if-no-files-found: ignore
  native-construction:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: femm_assistant
          target: femm-build
          load: true
          tags: femm-brain-native:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Reconstruct and inspect actual native geometry and meshes
        run: |
          mkdir -p native-reports
          docker run --rm --network none --read-only --memory=2g --cpus=2 \
            --pids-limit 256 --tmpfs /tmp:rw,size=512m \
            -v "$PWD:/repo:ro" -v "$PWD/native-reports:/reports" -w /repo \
            -e HOME=/tmp -e PYTHONDONTWRITEBYTECODE=1 \
            -e FEMM_DIR=/opt/femm/bin -e QT_QPA_PLATFORM=offscreen -e FEMM_MESH_EXPORT=1 \
            femm-brain-native:ci python3 -m femm_brain.native_check \
            --command /opt/femm/bin/femm-lua --output /reports
      # The strict solver command retains a nonzero exit for a source-reference
      # mismatch. The following audit must distinguish the reviewed EI issue
      # from any new failure; it never relabels individual targets as passed.
      - name: Generate and assess every registered source study without network access
        continue-on-error: true
        run: |
          mkdir -p native-solves
          docker run --rm --network none --read-only --memory=2g --cpus=2 \
            --pids-limit 256 --tmpfs /tmp:rw,size=512m \
            -v "$PWD:/repo:ro" -v "$PWD/native-solves:/reports" -w /repo \
            -e HOME=/tmp -e PYTHONDONTWRITEBYTECODE=1 \
            -e FEMM_DIR=/opt/femm/bin -e QT_QPA_PLATFORM=offscreen -e FEMM_MESH_EXPORT=1 \
            femm-brain-native:ci python3 -m femm_brain verify-solves \
            --engine native --command /opt/femm/bin/femm-lua --output /reports
      - name: Audit native checks and explicitly recorded publication discrepancies
        run: |
          docker run --rm --network none --read-only --memory=2g --cpus=2 \
            --pids-limit 256 --tmpfs /tmp:rw,size=512m \
            -v "$PWD/femm_brain:/repo/femm_brain:ro" -v "$PWD/native-solves:/reports" -w /repo \
            -e HOME=/tmp -e PYTHONDONTWRITEBYTECODE=1 \
            femm-brain-native:ci python3 -m femm_brain.benchmark_audit \
            --summary /reports/summary.json --output /reports/audit.json
      # Official model files are restored on the host by digest; the engine
      # container that opens them has no network and a read-only cache mount.
      - name: Restore the official model files that reproduction cases open
        run: python3 -m femm_brain restore-cache --for-reproductions --cache "$PWD/femm-cache"
      # The strict command keeps a nonzero exit for any failed frozen target. The
      # mandatory audit below accepts only reviewed, recorded failures.
      - name: Reproduce official examples from original files, stored data and article text
        continue-on-error: true
        run: |
          mkdir -p reproductions
          docker run --rm --network none --read-only --memory=2g --cpus=2 \
            --pids-limit 256 --tmpfs /tmp:rw,size=512m \
            -v "$PWD/femm_brain:/repo/femm_brain:ro" -v "$PWD/femm-cache:/cache:ro" -v "$PWD/reproductions:/reports" -w /repo \
            -e HOME=/tmp -e PYTHONDONTWRITEBYTECODE=1 -e FEMM_BRAIN_CACHE=/cache -e FEMM_LUA=/opt/femm/bin/femm-lua \
            -e FEMM_DIR=/opt/femm/bin -e QT_QPA_PLATFORM=offscreen -e FEMM_MESH_EXPORT=1 \
            femm-brain-native:ci python3 -m femm_brain reproduce --all --engine native --output /reports/cases
      - name: Audit reproduction failures against the reviewed registry
        run: python3 -m femm_brain reproduction-report --results reproductions/cases --output reproductions/official_reproductions.json --html reproductions/index.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: femm-brain-native-evidence
          path: |
            native-reports
            native-solves
            reproductions
          if-no-files-found: ignore
