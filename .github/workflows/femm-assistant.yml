name: FEMM 5 assistant
on:
  pull_request:
    paths:
      - 'femm_assistant/**'
      - '.github/workflows/femm-assistant.yml'
  push:
    branches: [main]
    paths:
      - 'femm_assistant/**'
      - '.github/workflows/femm-assistant.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: femm-assistant-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: femm_assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: femm_assistant/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check app/static/app.js
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: femm_assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_smoke.py
        env:
          BROWSER_SMOKE_ARTIFACTS: browser-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: femm-browser
          path: femm_assistant/browser-artifacts
          if-no-files-found: ignore
  linux-solver:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: femm_assistant
          load: true
          tags: femm-assistant:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate real FEMM solves
        run: docker run --rm --memory=2g --cpus=2 -e FEMM_LIVE_TEST=1 -e FEMM_MESH_EXPORT=1 femm-assistant:test python -m unittest discover -s tests -p 'test_*live.py' -v
