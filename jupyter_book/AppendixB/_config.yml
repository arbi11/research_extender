title: "Appendix B: Quantum Computing for Electromagnetic Design"
author: "Arbaaz Khan"
copyright: "2026"
exclude_patterns: ["_build", "**.ipynb_checkpoints", "**/__pycache__", "README.md"]

execute:
  execute_notebooks: "off"
  timeout: 180
  allow_errors: false

repository:
  url: https://github.com/arbi11/research_extender
  path_to_book: jupyter_book/AppendixB
  branch: main

html:
  use_repository_button: true
  use_issues_button: true

bibtex_bibfiles:
  - references.bib

sphinx:
  config:
    bibtex_reference_style: author_year

parse:
  myst_enable_extensions:
    - amsmath
    - colon_fence
    - dollarmath
