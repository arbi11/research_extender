[project]
name = "compem-book"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "deap>=1.4.4",
    "gymnasium>=1.4.0",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "jupyter-book>=2.1.7",
    "kaggle>=2.2.4",
    "matplotlib>=3.9,<3.11",
    "nbconvert>=7.17.1",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyfemm-qt",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "stable-baselines3>=2.9.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "tqdm>=4.70.1",
]

[tool.uv.sources]
pyfemm-qt = { path = "third_party/pyfemm", editable = true }
