title: "Chapter 2: Deep Learning for Magnetic Field Prediction"
author: "Thesis Author"
logo: ""
exclude_patterns: ["_build", "Thumbs.db", ".DS_Store", "**.ipynb_checkpoints"]

# Execution settings for notebooks
execute:
  execute_notebooks: force
  timeout: 120
  cache: ""
  allow_errors: false
  stderr_output: show
  run_in_temp: false

html:
  use_issues_button: true
  use_repository_button: true
  home_page_in_navbar: false
  google_analytics_id: null

# Build settings - fix nested build path issue
build:
  build_dir: "_build"

# Configure myst-nb to not automatically treat .md files as notebooks

# Define the name of the latex logo file
latex:
  latex_logo: ""

# Information about where the book exists on the web
repository:
  url: https://github.com/username/research_extender
  path_to_book: jupyter_book/Chp2
  branch: main

# Add GitHub buttons to your book
launch_buttons:
  notebook_interface: "classic"
  binderhub_url: null
  thebe: false

# Add bibtex bibliography
bibtex_bibfiles:
  - references.bib

# Advanced configuration
sphinx:
  config:
    html_show_sourcelink: true
    html_theme_options:
      navigation_depth: 4
    bibtex_reference_style: author_year

# Myst-nb configuration to handle .md files as markdown, not notebooks
mystnb:
  custom_formats: {}

parse:
  myst_enable_extensions:
    - amsmath
    - colon_fence
    - deflist
    - html_admonition
    - html_image
    - linkify
    - substitution
    - tasklist
    - dollarmath