# MyST / Jupyter Book 2 project for the whole CompEM book.
# Staging copy: notebooks are copied here from C1..C5/AppA (C3 from _runs/executed);
# data_gen/designs are symlinks back to the chapter folders for the rendered PNGs.
version: 1
project:
  title: "CompEM — Machine Learning for Electromagnetic Design"
  authors:
    - name: "Thesis Author"
  bibliography:
    - references.bib
  numbering:
    headings: true
    figure: true
    equation: true
  toc:
    - file: index.md
    - title: "Chapter 1: Introduction to ML for Electromagnetic Design"
      children:
        - file: C1/01_electric_machine.ipynb
        - file: C1/02_computation_sim.ipynb
        - file: C1/03_research_framework.ipynb
    - title: "Chapter 2: Deep Learning for Magnetic Field Prediction"
      children:
        - file: C2/01_Intro.ipynb
        - file: C2/02_modeling_fundamentals.ipynb
        - file: C2/03_data_pipeline.ipynb
        - file: C2/04a_ann_fundamentals.ipynb
        - file: C2/04b_cnn_architecture.ipynb
        - file: C2/04c_cnn_training.ipynb
        - file: C2/05_uncertainty_quantification.ipynb
        - file: C2/06a_pinn_theory_formulation.ipynb
        - file: C2/06b_pinns_methodology.ipynb
        - file: C2/07_conclusion.ipynb
    - title: "Chapter 3: RNN-based Performance Map Prediction"
      children:
        - file: C3/01_introduction.ipynb
        - file: C3/02_data_generation.ipynb
        - file: C3/03_architectures.ipynb
        - file: C3/04_model_implementation.ipynb
        - file: C3/05_transfer_learning.ipynb
        - file: C3/06_uncertainty_quantification.ipynb
        - file: C3/07_results.ipynb
        - file: C3/08_advanced_applications.ipynb
    - title: "Chapter 4: MDP Topology Optimization for Electrical Machines"
      children:
        - file: C4/00_preface.ipynb
        - file: C4/01_introduction.ipynb
        - file: C4/02_literature_survey.ipynb
        - file: C4/03_mdp_and_q_learning.ipynb
        - file: C4/04_seqTO_environment.ipynb
        - file: C4/05_genetic_algorithms.ipynb
        - file: C4/06_mdp_implementation.ipynb
        - file: C4/07_results_and_future_directions.ipynb
    - title: "Chapter 5: Deep Reinforcement Learning for Topology Optimization"
      children:
        - file: C5/01_introduction.ipynb
        - file: C5/02_literature_survey.ipynb
        - file: C5/03_function_approximators.ipynb
        - file: C5/04_deep_q_learning.ipynb
        - file: C5/05_policy_methods_and_actor_critic.ipynb
        - file: C5/06_seqto_v2_environment_and_setup.ipynb
        - file: C5/07_results_and_comparison.ipynb
        - file: C5/08_conclusions.ipynb
    - title: "Appendix A: Finite Element Analysis for Magnetostatics"
      children:
        - file: AppA/00_fea_magnetostatic_fundamentals.ipynb
  exports:
    - id: book-typst
      format: typst
      template: plain_typst_book
      output: _build/typst/compem_book.typ
site:
  template: book-theme
  options:
    folders: true
