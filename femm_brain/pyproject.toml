[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "femm-second-brain"
version = "0.1.0"
description = "A source-backed, three-layer FEMM engineering knowledge graph"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
femm-brain = "femm_brain.__main__:main"

[tool.setuptools]
packages = ["femm_brain"]
package-dir = {femm_brain = "."}
include-package-data = true

[tool.setuptools.package-data]
femm_brain = ["data/*.json", "data/models/*.json", "data/verification/*.json", "static/*", "static/vendor/*", "tests/*.py", "README.md"]
